// Raft messages between cluster nodes.
//
// raft-core treats every message as one-way: a response is a message of its
// own that travels back later, not the return value of a call. The wire
// protocol does the same. Each node opens one long-lived stream to each peer
// and sends its messages down it in order; nothing is returned per message.
// See ADR 0005 in the documentation.

syntax = "proto3";

package raftkv.raft.v1;

service Raft {
  // Delivers a sender's messages to the receiving node, in order. The stream
  // stays open for as long as the connection does.
  rpc Send(stream RaftMessage) returns (SendSummary);
}

message RaftMessage {
  uint64 from = 1;
  uint64 to = 2;
  // The sender's current term.
  uint64 term = 3;
  oneof body {
    RequestVote request_vote = 4;
    RequestVoteResponse request_vote_response = 5;
    AppendEntries append_entries = 6;
    AppendEntriesResponse append_entries_response = 7;
    InstallSnapshot install_snapshot = 8;
    InstallSnapshotResponse install_snapshot_response = 9;
  }
}

message RequestVote {
  uint64 last_log_index = 1;
  uint64 last_log_term = 2;
}

message RequestVoteResponse {
  bool granted = 1;
}

message AppendEntries {
  uint64 prev_log_index = 1;
  uint64 prev_log_term = 2;
  repeated Entry entries = 3;
  uint64 leader_commit = 4;
  // The leader's ReadIndex confirmation round, echoed in the response.
  uint64 read_round = 5;
}

message AppendEntriesResponse {
  bool success = 1;
  uint64 match_index = 2;
  uint64 conflict_index = 3;
  optional uint64 conflict_term = 4;
  // The read_round of the AppendEntries this answers.
  uint64 read_round = 5;
}

// One chunk of the leader's snapshot, for a follower that needs entries the
// leader has compacted. The leader sends the next chunk once the follower
// acknowledges this one.
message InstallSnapshot {
  // The last entry the snapshot includes, and its term.
  uint64 index = 1;
  uint64 term = 2;
  // Where this chunk starts in the snapshot, and the snapshot's size.
  uint64 offset = 3;
  uint64 total = 4;
  bytes data = 5;
  // The leader's ReadIndex confirmation round, echoed in the response.
  uint64 read_round = 6;
}

message InstallSnapshotResponse {
  // The index of the snapshot being transferred.
  uint64 index = 1;
  // How many bytes of it the follower holds: where the leader continues.
  uint64 received = 2;
  // Whether the follower now has everything up to index.
  bool done = 3;
  // The read_round of the InstallSnapshot this answers.
  uint64 read_round = 4;
}

message Entry {
  uint64 term = 1;
  uint64 index = 2;
  oneof payload {
    // An empty entry a new leader appends in its term.
    Noop noop = 3;
    // An opaque command for the replicated state machine.
    bytes command = 4;
  }
}

message Noop {}

// Sent when the sender closes its stream.
message SendSummary {
  // How many messages the receiver accepted on this stream.
  uint64 received = 1;
}
