name: Publish docs

# Publishes the documentation site to GitHub Pages on every push to main
# and after every nightly simulation: the mdBook (design, testing
# methodology, bug log) at the root, the rustdoc API reference under /api/,
# the benchmark graphs under /graphs/ (rendered from bench/history/), and
# badges with the latest nightly results under /graphs/badges/.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Simulation (nightly)]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Build the book
        run: mdbook build docs
      - name: Build the API reference
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Fetch the latest nightly results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest completed run, failed or not: a failure must show.
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sim-nightly.yml \
            --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          mkdir -p nightly
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --dir nightly || true
          fi
          find nightly -type f
      - name: Render the benchmark graphs and badges
        run: |
          python3 scripts/bench-graphs.py bench/history docs/book/graphs \
            --sim-stats nightly/nightly-simulation/sim-stats.json \
            --mutation-stats nightly/nightly-mutations/mutations.json
      - name: Assemble the site
        run: cp -r target/doc docs/book/api
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/book

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
